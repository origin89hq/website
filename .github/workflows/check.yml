name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm check
      - run: pnpm --filter origin89-website exec playwright install --with-deps chromium
      - name: Check the website and Storybook
        env:
          ORIGIN89_WEBSITE_URL: http://127.0.0.1:4325
          ORIGIN89_STORYBOOK_URL: http://127.0.0.1:4325/storybook
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --filter origin89-website preview:fixture --ip 127.0.0.1 --port 4325 --inspector-port 9235 > /tmp/website-fixture.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4325/ > /dev/null
          pnpm --filter origin89-website verify:website
          pnpm --filter origin89-website verify:storybook
          pnpm --filter origin89-website verify:buddy-assets
