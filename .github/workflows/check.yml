name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm check
      - run: pnpm --filter origin89-website exec playwright install --with-deps chromium
      - name: Check the website and Storybook
        env:
          ORIGIN89_WEBSITE_URL: http://127.0.0.1:4325
          ORIGIN89_STORYBOOK_URL: http://127.0.0.1:4325/storybook
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --filter origin89-website preview --ip 127.0.0.1 --port 4325 --inspector-port 9235 > /tmp/website-fixture.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4325/ > /dev/null
          pnpm --filter origin89-website verify:website
          pnpm --filter origin89-website verify:storybook
          pnpm --filter origin89-website verify:buddy-assets

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: website-production
    concurrency:
      group: website-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WEBSITE_WORKER_NAME: ${{ vars.WEBSITE_WORKER_NAME }}
      BUDDY_WORKER_NAME: ${{ vars.BUDDY_WORKER_NAME }}
      BUDDY_HOSTNAME: ${{ vars.BUDDY_HOSTNAME }}
    steps:
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Deploy the current main commit; this run is stale.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter origin89-website deploy:config
      - run: pnpm build
      # The secrets go up with the version rather than in a step of their own. The Worker's
      # config lists them as required, so a deploy without them is refused.
      - name: Deploy website with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the organization CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          if [ -z "$MAILCHIMP_API_KEY" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "MAILCHIMP_API_KEY or TURNSTILE_SECRET_KEY is not set; the waitlist would refuse every sign-up" >&2
            exit 1
          fi
          umask 077
          printf 'MAILCHIMP_API_KEY=%s\nTURNSTILE_SECRET_KEY=%s\n' "$MAILCHIMP_API_KEY" "$TURNSTILE_SECRET_KEY" > "$RUNNER_TEMP/secrets.env"
          trap 'rm -f "$RUNNER_TEMP/secrets.env"' EXIT
          pnpm --filter origin89-website deploy:cf --secrets-file "$RUNNER_TEMP/secrets.env"
